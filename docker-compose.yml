services:
  db:
    image: postgres:17
    container_name: invertir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: invertir
      POSTGRES_PASSWORD: invertir_dev_password
      POSTGRES_DB: invertir
    ports:
      - "5433:5432"
    volumes:
      - invertir_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invertir -d invertir"]
      interval: 5s
      timeout: 5s
      retries: 5

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.21.0
    container_name: invertir-dragonfly
    command: --cache_mode --proactivedefrag
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  invertir_pgdata:
